services:
  xarchive:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-9090}:9090"
    volumes:
      - config:/config
      - downloads:/downloads
      - cache:/cache
    environment:
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:?Set LOGIN_PASSWORD in .env}
      TZ: ${TZ:-Asia/Taipei}
      PROXY: ${PROXY:-}
    stop_grace_period: 20s

volumes:
  config:
  downloads:
  cache:
