name: Publish X Archive v1.0.13

on:
  push:
    branches: ['codex/release-v1.0.13']

env:
  RELEASE_TAG: v1.0.13
  RELEASE_REVISION: e80520d4267e133aff31117c8ff6593f52964215

permissions:
  contents: read

concurrency:
  group: release-v1.0.13
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_REVISION }}
      - name: Validate release source
        shell: bash
        run: |
          [[ "$(git rev-parse HEAD)" == "$RELEASE_REVISION" ]]
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check application
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
          for file in xarchive/static/*.js xarchive/integration/*.js; do node --check "$file"; done
          node tests/test_task_layout.mjs
          node tests/test_scriptcat_feedback.mjs
          docker compose config --quiet
          docker compose -f compose.nas.yaml config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Prepare and validate release notes
        run: |
          mkdir dist
          python - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['VERSION']
          repo = os.environ['GITHUB_REPOSITORY']
          for name in ('compose.yaml', 'compose.nas.yaml'):
              assert 'ghcr.io/' + repo + ':' + version in Path(name).read_text(), name + ' version mismatch'
          assert '/releases/tag/' + os.environ['RELEASE_TAG'] in Path('README.md').read_text()
          changelog = Path('CHANGELOG.md').read_text()
          notes = changelog.split('## ' + os.environ['RELEASE_TAG'] + ' ', 1)[1].split('\n## ', 1)[0]
          Path('dist/notes.md').write_text('## ' + os.environ['RELEASE_TAG'] + ' ' + notes + '\n\n镜像：`ghcr.io/' + repo + ':' + version + '`（amd64 / arm64）。\n')
          PY
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate images once
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:candidate-${{ env.RELEASE_REVISION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.RELEASE_REVISION }}
      - name: Smoke-test the exact candidate digest on both architectures
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          for arch in amd64 arm64; do
            python tests/docker_smoke.py "ghcr.io/$GITHUB_REPOSITORY@$IMAGE_DIGEST" "linux/$arch"
          done
      - name: Promote verified digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "ghcr.io/$GITHUB_REPOSITORY:$VERSION" --tag "ghcr.io/$GITHUB_REPOSITORY:latest" "ghcr.io/$GITHUB_REPOSITORY@$IMAGE_DIGEST"
      - name: Package release
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          git archive --format=zip --prefix="xarchive-$RELEASE_TAG/" --output="dist/xarchive-$RELEASE_TAG.zip" HEAD
          zip -j "dist/xarchive-docker-$RELEASE_TAG.zip" compose.yaml compose.nas.yaml README.md
          cp xarchive/integration/xarchive.user.js dist/
          printf 'ghcr.io/%s@%s\n' "$GITHUB_REPOSITORY" "$IMAGE_DIGEST" > dist/IMAGE.txt
          (cd dist && sha256sum *.zip xarchive.user.js IMAGE.txt > SHA256SUMS.txt)
          cat dist/IMAGE.txt >> dist/notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/xarchive.user.js dist/IMAGE.txt dist/SHA256SUMS.txt --target "$RELEASE_REVISION" --title "拾存 $RELEASE_TAG · 任务恢复修复" --notes-file dist/notes.md
