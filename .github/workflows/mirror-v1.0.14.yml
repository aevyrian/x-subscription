name: Request Docker Hub mirror for v1.0.14

on:
  push:
    branches:
      - codex/release-v1.0.14-recovery-ui
    paths:
      - .github/workflows/mirror-v1.0.14.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm release and start existing mirror workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/release-v1.0.14-recovery-ui'
          test "$(gh release view v1.0.14 --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = v1.0.14
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/mirror-dockerhub.yml/dispatches" \
            -f ref='codex/v1.0.1'
          echo 'Requested existing verified Docker Hub mirror workflow'
